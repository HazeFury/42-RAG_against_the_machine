[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Retrieval-Augmented Generation system over vLLM codebase"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "marberge", email = "marberge@student.42lyon.fr" }
]

dependencies = [
    "pydantic>=2.0.0",
    "bm25s>=0.2.0",
    "fire>=0.6.0",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "chonkie>=1.7.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
