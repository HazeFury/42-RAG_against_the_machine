[project]
name = "template-42-project"
version = "0.1.0"
description = "A standard 42 Python project template"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "marberge", email = "marberge@student.42lyon.fr" }
]

dependencies = []

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.20.0",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[tool.ruff]
# Set the maximum line length to 80 characters.
line-length = 79

[tool.ruff.lint]
# Enable specific rule sets.
# "E" and "W" are for pycodestyle (equivalent to Flake8 base rules)
# "F" is for Pyflakes
select = ["E", "F", "W"]

[tool.ruff.format]
# Standardize formatting
quote-style = "double"
indent-style = "space"