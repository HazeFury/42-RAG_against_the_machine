[project]
name = "rag-against-the-machine"
version = "1.0.0"
description = "Retrieval-Augmented Generation system over vLLM codebase"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "marberge", email = "marberge@student.42lyon.fr" }
]

dependencies = [
    "pydantic>=2.0.0",
    "bm25s>=0.2.0",
    "fire>=0.6.0",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "accelerate>=1.15.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 79
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "data",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "S101", # Use of assert (expected in pytest tests and preconditions)
    "B905", # zip() without an explicit strict= parameter
]

[tool.ruff.lint.per-file-ignores]
"src/cli.py" = ["BLE001"] # Top-level CLI entry points catch-all
"tests/*" = ["S101", "BLE001"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["^data/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
